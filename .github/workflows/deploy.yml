# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on: # Olha as ações que ocorreram
  push:
    branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]
jobs:
  build:

    runs-on: ubuntu-latest # Primeira coisa que faz e em que sistema operacional ele vai rodar
    
    #Ações que ele ira rodar
    steps:
    - uses: actions/checkout@v4 #Baixar o código
    - name: Set up JDK 25    #Baixar o java
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven  #Builda o projeto, já descobre se tem algo errado aqui
      run: mvn -B package --file pom.xml  
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: "dewfroguer"
        password: ${{secrets.DOCKERHUB_TOKEN}}
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
        
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: dewfroguer/api-pagamento:${{ github.sha }}

    - name: executing remote ssh commands using password
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_TEST }}
        username: "ubuntu"
        key: ${{ secrets.KEY_TEST }}
        port: 22
        script: |
          docker stop api-pagamento
          docker rm --force api-pagamento
          docker run -d -p 8080:8080 --name api-pagamento dewfroguer/api-pagamento:${{ github.sha }}

      
